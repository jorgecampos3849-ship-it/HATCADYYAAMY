<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>HATCADYYAAMY</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(270deg, #ff0080, #7928ca, #2afadf);
      background-size: 600% 600%;
      animation: fondo 10s ease infinite;
      margin: 0;
      overflow: hidden;
    }

    @keyframes fondo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      text-align: center;
      z-index: 100;
      background: rgba(255, 255, 255, 0.2);
      padding: 40px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 2px solid white;
      box-shadow: 0 0 30px rgba(0,0,0,0.2);
    }

    .box {
      padding: 30px 60px;
      background: linear-gradient(135deg, #ff4ecd, #ff9de2);
      color: white;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px;
      user-select: none;
      box-shadow: 0 0 30px rgba(255,255,255,0.6);
      animation: pulse 1.5s infinite;
    }

    .btn-no-tocar {
      margin-top: 50px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.5);
      color: #ff4444;
      font-size: 12px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-block;
      border: 1px solid #ff4444;
      transition: 0.3s;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .secret, .final {
      margin-top: 25px;
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }

    .final {
      font-size: 38px;
      background: linear-gradient(90deg, #fff, #ffebee, #ffc107, #fff);
      background-size: 200%;
      -webkit-background-clip: text;
      color: transparent;
      animation: arcoiris 2s linear infinite;
    }

    #jumpscare-container {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: black; z-index: 9999;
      justify-content: center; align-items: center;
    }

    #foxy-img {
      width: 100%; height: 100%; object-fit: contain;
      animation: shake-jumpscare 0.1s infinite;
    }

    @keyframes shake-jumpscare {
      0% { transform: translate(5px, 5px); }
      50% { transform: translate(-5px, -5px); }
      100% { transform: translate(5px, -5px); }
    }

    .elemento-lluvia {
      position: absolute;
      z-index: 1;
      white-space: nowrap;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
      font-weight: bold;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(20deg); opacity: 0; }
    }

    .img-decor {
      position: fixed;
      z-index: 5;
      max-height: 220px;
      max-width: 180px;
      border-radius: 15px;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      object-fit: cover;
    }
    .foto1 { left: 5%; top: 10%; transform: rotate(-8deg); }
    .foto2 { left: 5%; bottom: 10%; transform: rotate(8deg); }
    .foto3 { right: 5%; top: 10%; transform: rotate(8deg); }
    .foto4 { right: 5%; bottom: 10%; transform: rotate(-8deg); }
    .foto5 { bottom: 5%; left: 50%; transform: translateX(-50%); }

    @keyframes arcoiris { from { background-position: 0%; } to { background-position: 200%; } }
  </style>
</head>
<body>

  <div id="jumpscare-container">
    <img id="foxy-img" src="https://i.imgur.com/vHIn8m5.jpg" alt="FOXY">
  </div>

  <img src="https://i.postimg.cc/hhWJ44gs/b46d8a25-b4e4-4b6c-8e4d-6cf4a746fbfd.jpg" class="img-decor foto1">
  <img src="https://i.postimg.cc/DykdwnCm/ca4415d8-1296-42e4-9065-1242010b7939.jpg" class="img-decor foto2">
  <img src="https://i.postimg.cc/jSRHyvYr/2d6a40f7-1e27-4eae-a00e-9837bfaef16c.jpg" class="img-decor foto3">
  <img src="https://i.postimg.cc/fLSmMrmR/471bd2f7-253f-4f0e-80c1-766fc0098775.jpg" class="img-decor foto4">
  <img src="https://i.postimg.cc/x8KmzNsC/a326100f-2290-49b3-adc1-c5445eaa9e4e.jpg" class="img-decor foto5">

  <div class="container">
    <div class="box" onclick="iniciarEfecto(event)">AQUÍ BOBA</div>
    <div class="secret" id="textoSecreto"></div>
    <div id="mensajeFinal" class="final"></div>
    <div class="btn-no-tocar" onclick="jumpscare()">NO TOQUES AQUÍ</div>
  </div>

  <audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
  <audio id="foxySound" src="https://www.myinstants.com/media/sounds/fnaf-1-jumpscare-sound.mp3"></audio>
  
  <audio id="cancionPrincipal" loop>
    <source src="https://www.mboxdrive.com/Rita%20Pay%c3%a9s%20-%20Algo%20Contigo.mp3" type="audio/mpeg">
  </audio>

  <script>
    const textoCompleto = "LA CONTRASEÑA ES: PUCHIPUCHI";
    const textoFinal = "YO TE AMO MÁS ❤️";
    const halagos = ["GUAPA", "HERMOSA", "PRECIOSA", "MI NIÑA", "LA MEJOR PIANISTA 🎹", "FILÓSOFA 📚", "MI VIDA", "TE ADORO"];
    let yaIniciado = false;

    function iniciarEfecto(event) {
      if (yaIniciado) return;
      yaIniciado = true;

      // Reproducir sonido de click y la canción principal
      document.getElementById('clickSound').play();
      const musica = document.getElementById('cancionPrincipal');
      musica.volume = 0.6; // Volumen al 60% para que se oiga bien
      musica.play();
      
      setInterval(crearElementoLluvia, 250);
      escribirTexto();
    }

    function escribirTexto() {
      const cont = document.getElementById('textoSecreto');
      let i = 0;
      const intervalo = setInterval(() => {
        cont.textContent += textoCompleto.charAt(i);
        i++;
        if (i >= textoCompleto.length) {
          clearInterval(intervalo);
          setTimeout(escribirFinal, 500);
        }
      }, 70);
    }

    function escribirFinal() {
      const final = document.getElementById('mensajeFinal');
      final.textContent = textoFinal;
    }

    function crearElementoLluvia() {
      const el = document.createElement('div');
      el.className = 'elemento-lluvia';
      if (Math.random() > 0.4) {
        el.textContent = halagos[Math.floor(Math.random() * halagos.length)];
        el.style.fontSize = (Math.random() * 15 + 18) + 'px';
      } else {
        const iconos = ['❤', '💖', '💕', '✨', '🌸'];
        el.textContent = iconos[Math.floor(Math.random() * iconos.length)];
        el.style.fontSize = (Math.random() * 20 + 25) + 'px';
      }
      el.style.left = Math.random() * 90 + 'vw';
      const colores = ['#ffffff', '#ffeb3b', '#f8bbd0', '#ff4ecd'];
      el.style.color = colores[Math.floor(Math.random() * colores.length)];
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function jumpscare() {
      const container = document.getElementById('jumpscare-container');
      const sound = document.getElementById('foxySound');
      // Pausar música romántica un momento para el susto
      const musica = document.getElementById('cancionPrincipal');
      musica.pause();

      container.style.display = 'flex';
      sound.play();
      
      setTimeout(() => {
        container.style.display = 'none';
        musica.play(); // Reanudar la música después del susto
      }, 2000);
    }
  </script>
</body>
</html>
